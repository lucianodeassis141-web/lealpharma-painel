/* Escolhe quem está usando. Não filtra nada: o nome vai para o Registro e para "Quem faz" da tarefa nova */
function mostrarEntrada(){
  if ($("entrada")) return;
  const trocando = !!S.quem;
  const el = document.createElement("div");
  el.className = "entrada"; el.id = "entrada"; el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true"); el.setAttribute("aria-labelledby", "entradaT");
  const logo = document.querySelector(".marca .logo")?.outerHTML || "";
  const op = (nome, cls, letra) => `<button type="button" data-quem="${nome}" aria-pressed="${S.quem === nome}"><span class="k-av ${cls}">${letra}</span><b>${nome}</b>${S.quem === nome ? "<small>usando agora</small>" : ""}</button>`;
  el.innerHTML = `<canvas class="entrada-fundo" aria-hidden="true"></canvas><div class="entrada-c">${logo}<div class="sub">Painel de execução</div>
    <h2 id="entradaT">Quem está usando o painel?</h2><p>Escolha o seu nome para entrar.</p>
    <div class="entrada-op">${op("Luciano", "l", "L")}${op("Adrian", "a", "A")}</div>
    <div class="nota">Fica salvo neste aparelho. Para trocar, use Sair no rodapé do menu.</div>
    ${trocando ? `<button type="button" class="fechar" data-fechar>Voltar ao painel</button>` : ""}</div>`;
  document.body.appendChild(el);
  const parar = particulas(el, el.querySelector(".entrada-fundo"));
  const sair = () => { el.classList.add("saindo"); setTimeout(() => { parar(); el.remove(); }, semMov() ? 0 : 220); };
  el.querySelectorAll("[data-quem]").forEach(b => b.onclick = () => {
    S.quem = b.dataset.quem; lsSet("lp2.quem", S.quem); renderQuem(); sair();
    toast("Entrou como " + S.quem);
  });
  const f = el.querySelector("[data-fechar]"); if (f) f.onclick = sair;
  el.addEventListener("keydown", e => { if (e.key === "Escape" && trocando) sair(); });
  /* na primeira vez o foco fica na tela, para nenhum nome parecer já escolhido */
  if (trocando) el.querySelector('[aria-pressed="true"]').focus(); else { el.tabIndex = -1; el.style.outline = "none"; el.focus(); }
}
/* fundo da tela de entrada, no jeito do "particle effect for hero" do 21st.dev (Luciano, 21/10):
   atrás, estrelinhas que piscam e sobem em três camadas, com paralaxe do mouse; na frente, pontos presos a um lugar que deriva devagar
   (1 em 3 azul) que o mouse ou o dedo empurra num raio de 90 px. Soltos, voltam como mola,
   se esbarram e acendem conforme a velocidade. No centro, uma luz azul que pulsa devagar.
   Devolve a função que para a animação */
function particulas(tela, cv){
  const ctx = cv.getContext("2d"); if (!ctx) return () => {};
  const RAIO = 90, MOLA = .08, ATRITO = .9, FORCA = 1.2;  /* raio na metade do original (Luciano, 21/10) */
  let w = 0, h = 0, pontos = [], estrelas = [], raf = 0;
  const mouse = { x:-1000, y:-1000, ativo:false };
  const parado = semMov();
  const entre = (a, b) => Math.random() * (b - a) + a;
  const medir = () => {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight; cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pontos = Array.from({ length: Math.floor(w * h * 21.7e-5) }, () => { const x = Math.random() * w, y = Math.random() * h;
      return { x, y, ox:x, oy:y, vx:0, vy:0, dx:(Math.random() - .5) * .12, dy:(Math.random() - .5) * .12, r:entre(1, 2.5), azul:Math.random() > .65 }; });
    /* três camadas que sobem sem parar, como o "stars" do bundui: as pequenas sobem mais rápido (16, 8 e 5 px por segundo) */
    estrelas = Array.from({ length: Math.floor(w * h * 8e-5) }, () => { const c = Math.random(); const cam = c < .6 ? 0 : c < .88 ? 1 : 2;
      return { x:Math.random() * w, y:Math.random() * h, sobe:[16, 8, 5][cam], r:[entre(.5, 1), entre(1, 1.5), entre(1.5, 2)][cam],
        a:[entre(.15, .4), entre(.25, .55), entre(.35, .7)][cam], fase:Math.random() * Math.PI * 2, azul:Math.random() > .6 }; });
  };
  /* campo de anti-gravidade no formato das letras e do desenho do logo (Luciano, 21/10): as letras são desenhadas
     num mapa pequeno (1 casa = 3 px) e cada casa guarda a distância até a letra mais perto. Nenhum ponto chega a menos
     de CAMPO px do traço: quem chega perto bate e volta para onde estava indo */
  const CAMPO = 22, CASA = 3; let mapa = null, gw = 0, gh = 0, centros = [];
  const linhas = (c, txt, larg) => {  /* quebra o texto como a tela quebrou (título em duas linhas no celular) */
    if (c.measureText(txt).width <= larg + 4) return [txt];
    const out = []; let l = "";
    for (const pal of txt.split(" ")) { const t = l ? l + " " + pal : pal; if (l && c.measureText(t).width > larg + 4) { out.push(l); l = pal; } else l = t; }
    return out.concat(l ? [l] : []);
  };
  const medirZonas = () => {
    const els = [...tela.querySelectorAll(".logo, .sub, h2, .entrada-c > p, .entrada-op button")];
    centros = els.map(el => { const r = el.getBoundingClientRect(); return { x:(r.left + r.right) / 2, y:(r.top + r.bottom) / 2 }; });
    gw = Math.ceil(w / CASA); gh = Math.ceil(h / CASA);
    const m = document.createElement("canvas"); m.width = gw; m.height = gh;
    const c = m.getContext("2d", { willReadFrequently:true }); c.scale(1 / CASA, 1 / CASA); c.fillStyle = "#fff";
    /* os cartões de Luciano e Adrian entram como a caixa arredondada deles (Luciano, 21/10) */
    for (const el of els.filter(e => e.matches(".entrada-op button"))) { const r = el.getBoundingClientRect(); c.beginPath(); c.roundRect(r.left, r.top, r.width, r.height, 20); c.fill(); }
    for (const el of els.filter(e => !e.classList.contains("logo") && !e.matches(".entrada-op button"))) {
      const cs = getComputedStyle(el), r = el.getBoundingClientRect();
      c.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
      try { c.letterSpacing = cs.letterSpacing === "normal" ? "0px" : cs.letterSpacing; } catch(_) {}
      let txt = el.textContent.trim(); if (cs.textTransform === "uppercase") txt = txt.toUpperCase();
      const ls = linhas(c, txt, r.width), alt = r.height / ls.length;
      c.textAlign = "center"; c.textBaseline = "middle";
      ls.forEach((l, k) => c.fillText(l, (r.left + r.right) / 2, r.top + alt * (k + .5)));
    }
    const terminar = () => {
      const px = c.getImageData(0, 0, gw, gh).data; const INF = 1e9, D = Math.SQRT2 * CASA;
      const dist = new Float32Array(gw * gh);
      for (let k = 0; k < gw * gh; k++) dist[k] = px[k * 4 + 3] > 60 ? 0 : INF;
      /* distância em duas passadas (ida e volta) */
      for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) { const k = y * gw + x; let d = dist[k]; if (!d) continue;
        if (x > 0) d = Math.min(d, dist[k - 1] + CASA); if (y > 0) { d = Math.min(d, dist[k - gw] + CASA); if (x > 0) d = Math.min(d, dist[k - gw - 1] + D); if (x < gw - 1) d = Math.min(d, dist[k - gw + 1] + D); } dist[k] = d; }
      for (let y = gh - 1; y >= 0; y--) for (let x = gw - 1; x >= 0; x--) { const k = y * gw + x; let d = dist[k]; if (!d) continue;
        if (x < gw - 1) d = Math.min(d, dist[k + 1] + CASA); if (y < gh - 1) { d = Math.min(d, dist[k + gw] + CASA); if (x < gw - 1) d = Math.min(d, dist[k + gw + 1] + D); if (x > 0) d = Math.min(d, dist[k + gw - 1] + D); } dist[k] = d; }
      mapa = dist;
      /* quem nasceu dentro do campo nasce de novo fora dele, para não juntar todo mundo na borda */
      for (const q of pontos) for (let t = 0; t < 8 && fuga(q.ox, q.oy); t++) { q.ox = q.x = Math.random() * w; q.oy = q.y = Math.random() * h; }
    };
    /* o logo é desenho (SVG): vira imagem para entrar no mapa */
    const logo = els.find(e => e.classList.contains("logo"));
    if (!logo) return terminar();
    const r = logo.getBoundingClientRect();
    let svg = logo.outerHTML.replace(/currentColor/g, "#fff"); if (!/xmlns=/.test(svg)) svg = svg.replace("<svg", '<svg xmlns="http://www.w3.org/2000/svg"');
    const img = new Image();
    img.onload = () => { c.drawImage(img, r.left, r.top, r.width, r.height); terminar(); };
    img.onerror = () => { c.fillRect(r.left, r.top, r.width, r.height); terminar(); };
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  };
  /* distância até o traço mais perto e a direção para fugir dele */
  const fuga = (x, y) => {
    if (!mapa) return null;
    const i = Math.floor(x / CASA), j = Math.floor(y / CASA);
    if (i < 1 || j < 1 || i >= gw - 1 || j >= gh - 1) return null;
    const k = j * gw + i, d = mapa[k]; if (d >= CAMPO) return null;
    let nx = mapa[k + 1] - mapa[k - 1], ny = mapa[k + gw] - mapa[k - gw]; const n = Math.hypot(nx, ny);
    if (n > .001) { nx /= n; ny /= n; }
    else { let c0 = centros[0]; for (const c of centros) if (Math.hypot(c.x - x, c.y - y) < Math.hypot(c0.x - x, c0.y - y)) c0 = c; nx = x - c0.x; ny = y - c0.y; const q = Math.hypot(nx, ny) || 1; nx /= q; ny /= q; }
    return { d, nx, ny };
  };
  let antes = 0; const par = { x:0, y:0 };  /* paralaxe: o céu escorrega para o lado contrário do mouse */
  const quadro = ms => {
    ms = ms || 0; const dt = antes ? Math.min((ms - antes) / 1000, .05) : 0; antes = ms;
    const ax = mouse.x > -1000 ? -(mouse.x - w / 2) * .05 : 0, ay = mouse.y > -1000 ? -(mouse.y - h / 2) * .05 : 0;
    par.x += (ax - par.x) * .06; par.y += (ay - par.y) * .06;
    ctx.clearRect(0, 0, w, h);
    const luz = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.max(w, h) * .7);
    luz.addColorStop(0, `rgba(66,133,244,${Math.sin(ms * 8e-4) * .035 + .085})`); luz.addColorStop(1, "rgba(6,8,21,0)");
    ctx.fillStyle = luz; ctx.fillRect(0, 0, w, h);
    for (const e of estrelas) {
      ctx.fillStyle = e.azul ? "#4DA3FF" : "#fff";
      e.y -= e.sobe * dt; if (e.y < -40) { e.y += h + 80; e.x = Math.random() * w; }
      let x = (e.x + par.x) % w, y = e.y + par.y; if (x < 0) x += w;
      const fz = fuga(x, y); const longe = fz ? fz.d / CAMPO : 1;  /* perto das letras a estrelinha some */
      if (longe <= 0) continue;
      ctx.globalAlpha = e.a * longe * (.3 + .7 * (Math.sin(ms * .002 + e.fase) * .5 + .5));
      ctx.beginPath(); ctx.arc(x, y, e.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    /* o lugar de cada ponto deriva devagar (todas as estrelas se movem um pouco, Luciano 21/10);
       empurrão do mouse e mola de volta para esse lugar */
    for (const p of pontos) {
      p.ox += p.dx; p.oy += p.dy;
      if (p.ox < -5) { p.ox += w + 10; p.x += w + 10; } if (p.ox > w + 5) { p.ox -= w + 10; p.x -= w + 10; }
      if (p.oy < -5) { p.oy += h + 10; p.y += h + 10; } if (p.oy > h + 5) { p.oy -= h + 10; p.y -= h + 10; }
      const dx = mouse.x - p.x, dy = mouse.y - p.y, d = Math.hypot(dx, dy);
      if (mouse.ativo && d < RAIO && d > 0) { const f = (RAIO - d) / RAIO * FORCA * 5; p.vx -= dx / d * f; p.vy -= dy / d * f; }
      p.vx += (p.ox - p.x) * MOLA; p.vy += (p.oy - p.y) * MOLA;
      const fz = fuga(p.x, p.y);
      if (fz) { const f = (CAMPO - fz.d) / CAMPO * 2.4; p.vx += fz.nx * f; p.vy += fz.ny * f;
        const ida = p.vx * fz.nx + p.vy * fz.ny; if (ida < 0) { p.vx -= 1.8 * ida * fz.nx; p.vy -= 1.8 * ida * fz.ny; } }
      /* o caminho do ponto bate no campo e volta: a direção da deriva rebate na parede, sem ninguém ficar parado na
         borda (assim o formato das letras não aparece desenhado pelos pontos, Luciano 21/10) */
      const fo = fuga(p.ox, p.oy);
      if (fo) { const ida = p.dx * fo.nx + p.dy * fo.ny; if (ida < 0) { p.dx -= 2 * ida * fo.nx; p.dy -= 2 * ida * fo.ny; } p.ox += fo.nx * 1.5; p.oy += fo.ny * 1.5; }
    }
    /* esbarrão: separa os que se encostam e troca o impulso */
    for (let i = 0; i < pontos.length; i++) for (let j = i + 1; j < pontos.length; j++) {
      const a = pontos[i], b = pontos[j], dx = b.x - a.x, dy = b.y - a.y, soma = a.r + b.r, d2 = dx * dx + dy * dy;
      if (d2 >= soma * soma) continue;
      const d = Math.sqrt(d2); if (d <= .01) continue;
      const nx = dx / d, ny = dy / d, sobra = (soma - d) / 2;
      a.x -= nx * sobra; a.y -= ny * sobra; b.x += nx * sobra; b.y += ny * sobra;
      const rel = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
      if (rel > 0) { const imp = -1.85 * rel / (1 / a.r + 1 / b.r); a.vx += imp * nx / a.r; a.vy += imp * ny / a.r; b.vx -= imp * nx / b.r; b.vy -= imp * ny / b.r; }
    }
    for (const p of pontos) {
      p.vx *= ATRITO; p.vy *= ATRITO; p.x += p.vx; p.y += p.vy;
      ctx.fillStyle = p.azul ? "#4DA3FF" : `rgba(255,255,255,${Math.min(.3 + Math.hypot(p.vx, p.vy) * .1, 1)})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    if (!parado) raf = requestAnimationFrame(quadro);
  };
  const mover = e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.ativo = true; };
  const soltar = () => { mouse.ativo = false; };
  /* clique ou toque: o mesmo empurrão, de uma vez e mais forte, espalhando as estrelas em volta (Luciano, 21/10) */
  const estouro = e => {
    mover(e);
    const R = 390;  /* o triplo do que era (130 px), bem maior que o do mouse (Luciano, 21/10) */
    for (const p of pontos) {
      const dx = p.x - e.clientX, dy = p.y - e.clientY, d = Math.hypot(dx, dy);
      if (d < R && d > 0) { const f = (R - d) / R * 22; p.vx += dx / d * f; p.vy += dy / d * f; }
    }
  };
  const redimensionar = () => { medir(); medirZonas(); if (parado) quadro(); };
  medir(); medirZonas(); quadro();
  /* de novo quando as fontes e a entrada das letras terminarem, para o contorno ficar no lugar certo */
  document.fonts?.ready.then(() => { if (tela.isConnected) medirZonas(); });
  const remedir = setTimeout(() => { if (tela.isConnected) medirZonas(); }, 1400);
  if (!parado) { tela.addEventListener("pointermove", mover); tela.addEventListener("pointerdown", estouro); tela.addEventListener("pointerleave", soltar); tela.addEventListener("pointerup", e => { if (e.pointerType === "touch") soltar(); }); }
  addEventListener("resize", redimensionar);
  return () => { cancelAnimationFrame(raf); clearTimeout(remedir); removeEventListener("resize", redimensionar); };
}
function renderQuem(){

  const b = $("sairQuem"); if (b) b.onclick = () => { S.quem = ""; lsSet("lp2.quem", ""); renderQuem(); mostrarEntrada(); };
}
