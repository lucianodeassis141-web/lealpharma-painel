<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Painel LealPharma</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,900&family=Geist+Mono:wght@400;500;600&family=Montserrat:wght@300;700&family=Outfit:wght@300;400;500;600;700&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: menu lateral azul-marinho com o logo azul + área principal clara com topo (escopo) e a vista ativa */
:root{
  --onix:#FFFFFF; --fundo:#F3F5F9; --lateral:#141933; --cartao:#FFFFFF; --cartao2:#FFFFFF; --coluna:#E9EDF4; --linha:#DCE1EA; --hover:#F6F8FC; --trilho:#E3E8F0;
  --amarelo:#1E6FD9; --amarelo-fundo:#E6F0FD; --amarelo-borda:#B8D3F7; --gelo:#141933; --prata:#56607A; --apagado:#8590A3;
  --verde:#1C8C4E; --verde-fundo:#E4F5EB; --verde-borda:#B5E0C6; --vermelho:#C93A26; --vermelho-fundo:#FDECE8; --vermelho-borda:#F3C2B9;
  --azul:#6A4BD1; --azul-fundo:#F0ECFC; --azul-borda:#D3C8F5; --laranja:#B35F00; --laranja-fundo:#FFF2E0; --laranja-borda:#F5D3A6;
  --sombra:0 1px 2px rgba(20,25,51,.06),0 1px 1px rgba(20,25,51,.04);
  --f-titulo:"Archivo",system-ui,"Segoe UI",sans-serif;
  --f-texto:"Archivo",system-ui,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:light;
}
/* menu lateral: azul-marinho do logo, texto claro */
.lateral{--gelo:#F1F4FA; --prata:#AEB7CC; --apagado:#7D88A3; --cartao:#1F2647; --linha:#2A3256; --amarelo:#4DA3FF; --amarelo-fundo:#233466; --amarelo-borda:#35539A; --onix:#141933; color-scheme:dark}
html,body{height:100%}
body{background:var(--fundo);color:var(--gelo);font-family:var(--f-texto);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--lateral)}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
/* ---------- lateral ---------- */
.lateral{background:var(--lateral);border-right:1px solid var(--linha);display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));padding-left:env(safe-area-inset-left,0px)}
.marca{padding:26px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.marca .logo{width:168px;height:auto;display:block;color:var(--gelo)}
.marca .sub{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--prata)}
.fio{height:3px;margin:0 16px 14px;border-radius:3px;background:linear-gradient(90deg,var(--prata) 0 50%,var(--amarelo) 50% 100%)}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px;border-radius:7px;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--prata);border:1px solid transparent}
.nav button:hover{color:var(--gelo);background:var(--cartao)}
.nav button[aria-current="page"]{color:var(--gelo);background:var(--amarelo-fundo);border-color:var(--amarelo-borda)}
.nav button:focus-visible{outline:2px solid var(--amarelo);outline-offset:1px}
.nav .n{font-family:var(--f-mono);font-size:10.5px;font-weight:500;background:var(--cartao);color:var(--amarelo);padding:1px 7px;border-radius:99px;letter-spacing:0}
.rodape-lateral{margin-top:auto;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--linha);font-size:11.5px;color:var(--apagado);display:flex;flex-direction:column;gap:6px}
.vivo{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--apagado)}
.dot.on{background:var(--amarelo);box-shadow:0 0 0 3px rgba(77,163,255,.2)}
.nav-grupo{font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--apagado);padding:12px 10px 4px 22px}
.nav button.sub{padding:8px 10px 8px 22px;font-size:12.5px;font-weight:600;letter-spacing:.02em;text-transform:none;position:relative}
.nav button.sub::before{content:"";position:absolute;left:12px;top:50%;width:4px;height:4px;border-radius:50%;background:var(--apagado);transform:translateY(-50%)}
.nav button.sub[aria-current="page"]::before{background:var(--amarelo)}
.nav-sep{height:1px;background:var(--linha);margin:8px 10px}
.pill.frente{color:var(--amarelo);border-color:var(--amarelo-borda);background:var(--amarelo-fundo)}
.frentes-ed{display:flex;flex-wrap:wrap;gap:6px}
.chip-f{display:inline-flex;align-items:center;gap:4px;padding:5px 6px 5px 12px;border-radius:99px;background:var(--amarelo-fundo);border:1px solid var(--amarelo-borda);font-size:13px;font-weight:600}
.chip-f{padding-left:7px;gap:7px}
.chip-f .cor-f{-webkit-appearance:none;appearance:none;width:18px;height:18px;padding:0;border:none;border-radius:50%;background:none;cursor:pointer;flex:none}
.chip-f .cor-f::-webkit-color-swatch-wrapper{padding:0}
.chip-f .cor-f::-webkit-color-swatch{border:1px solid rgba(20,25,51,.18);border-radius:50%}
.chip-f .cor-f::-moz-color-swatch{border:1px solid rgba(20,25,51,.18);border-radius:50%}
.chip-f .cor-f:disabled{cursor:default}
.chip-f .cor-f:focus-visible{outline:2px solid #1E6FD9;outline-offset:2px}
.chip-f button{all:unset;cursor:pointer;padding:0 6px;color:var(--apagado);font-size:15px;line-height:1}
.chip-f button:hover{color:var(--vermelho)}
.abas-wrap{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--linha);margin-bottom:-6px}
.abas{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;scrollbar-color:#9AA6BC transparent;padding-bottom:4px}
/* barra para puxar as abas: só aparece quando nem todas cabem (Luciano, 21/10) */
.abas::-webkit-scrollbar{height:10px}
.abas::-webkit-scrollbar-track{background:var(--coluna);border-radius:99px}
.abas::-webkit-scrollbar-thumb{background:#9AA6BC;border-radius:99px;border:2px solid var(--coluna)}
.abas::-webkit-scrollbar-thumb:hover{background:var(--amarelo)}
.seta{all:unset;cursor:pointer;flex:none;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;font-size:26px;line-height:1;font-weight:500;color:var(--gelo);background:var(--cartao);border:1.5px solid var(--linha);box-shadow:0 4px 12px rgba(30,111,217,.12);margin-bottom:6px}
.seta:hover{background:var(--amarelo);color:#fff;border-color:var(--amarelo)}
.seta:focus-visible{outline:2px solid var(--amarelo);outline-offset:2px}
.abas-wrap .pos{flex:none;font-family:var(--f-mono);font-size:12px;color:var(--apagado);margin-bottom:6px}
.abas button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:12px 18px;font-weight:700;font-size:15px;color:var(--prata);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;border-radius:10px 10px 0 0}
.abas button:hover{color:var(--gelo);background:var(--coluna)}
.abas button[aria-selected="true"]{color:var(--amarelo);border-bottom-color:var(--amarelo);background:var(--amarelo-fundo)}
.abas button:focus-visible{outline:2px solid var(--amarelo);outline-offset:-2px}
.abas .n{font-family:var(--f-mono);font-size:11px;font-weight:500;background:var(--coluna);color:var(--gelo);padding:1px 7px;border-radius:99px}
.abas button[aria-selected="true"] .n{background:var(--amarelo);color:#fff}
/* cor do canal: bolinha em toda aba; aba aberta e caixotes na cor do canal */
.abas .ponto{width:10px;height:10px;border-radius:50%;background:var(--mc);box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.abas button[data-marca][aria-selected="true"]{color:var(--mt);border-bottom-color:var(--mc);background:var(--mf)}
.abas button[data-marca][aria-selected="true"] .n{background:var(--mc);color:var(--mn)}
/* abas com o nome da marca no estilo dela (Luciano, 21/10) */
.abas button.com-selo{padding:10px 10px 12px;gap:10px}
.abas button.com-selo:hover{background:transparent}
.selo{display:inline-flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;width:176px;height:44px;padding:0 12px;border-radius:12px;opacity:.6;transition:opacity .15s,box-shadow .15s,transform .15s}
.abas button.com-selo:hover .selo{opacity:.9}
.abas button.com-selo[aria-selected="true"]{background:transparent;border-bottom-color:var(--mc)}
.abas button.com-selo[aria-selected="true"] .selo{opacity:1;box-shadow:0 6px 16px rgba(20,25,51,.18)}
.selo img{display:block;width:auto}
.s-ml{background:#FFE600} .s-ml img{height:32px}
.s-sp{background:#EE4D2D} .s-sp img{height:24px}
.s-am{background:#F80032} .s-am img{height:24px}
.s-mg{background:#0086FF} .s-mg img{height:30px}
.s-tt{background:#000;color:#fff} .s-tt img{height:22px;filter:invert(1) drop-shadow(-1.5px -1px 0 #25F4EE) drop-shadow(1.5px 1px 0 #FE2C55)}
.s-tt b{font-size:16px;font-weight:800;letter-spacing:-.01em}
.s-pj{background:#1E6FD9;color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.1}
.s-pj b{font-size:15px;font-weight:800} .s-pj small{font-size:11px;font-weight:600;opacity:.85;letter-spacing:.04em;text-transform:uppercase}
.kpis.cor-canal .kpi{border-top-color:var(--mc)}
.kpis.cor-canal .kpi.am .v{color:var(--gelo)}  /* progresso sempre preto (Luciano, 21/10) */
/* botão de atalho do filtro de área */
.btn-filtro{all:unset;cursor:pointer;font-size:13px;font-weight:700;padding:8px 14px;border-radius:8px;border:1px solid var(--linha);background:var(--cartao);color:var(--gelo)}
.btn-filtro:hover{border-color:var(--prata)}
.btn-filtro[aria-pressed="true"]{background:var(--amarelo);border-color:var(--amarelo);color:#fff}
.btn-filtro:focus-visible{outline:2px solid var(--amarelo);outline-offset:2px}
/* contas */
.sub-abas{align-self:flex-start;flex-wrap:wrap;border-radius:14px}
.sub-abas button{border-radius:10px}
.grupo-contas{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.selo-grupo .selo{opacity:1;width:150px;height:36px;transform-origin:left center}
.selo-grupo .s-ml img{height:26px} .selo-grupo .s-sp img,.selo-grupo .s-am img{height:20px} .selo-grupo .s-mg img{height:24px}
.s-todas{background:#141933;color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.1}
.s-todas b{font-size:15px;font-weight:800} .s-todas small{font-size:11px;font-weight:600;opacity:.8;letter-spacing:.04em;text-transform:uppercase}
.bola{display:inline-block;width:10px;height:10px;border-radius:50%;background:rgb(var(--cr));box-shadow:0 0 0 3px rgba(var(--cr),.18);flex:none}
.conta-t b{display:flex;align-items:center;gap:8px}
.conta-c{border-left:4px solid rgb(var(--cr)) !important}
/* contas em botões (Luciano, 21/10): fundo na cor da frente, bolinha na cor da situação */
.sel-cores{font:inherit;font-size:14px;font-weight:700;min-width:280px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--linha);background:var(--cartao);color:var(--gelo);cursor:pointer}
.sel-cores:focus{outline:2px solid var(--amarelo);outline-offset:2px}
.sel-cores optgroup{background:#fff;color:#56607A;font-style:normal;font-weight:700}
.sel-selo{flex:none}
.sel-botao-selo{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:4px;border-radius:14px}
.sel-botao-selo .selo{opacity:1;box-shadow:0 6px 16px rgba(20,25,51,.18)}
.sel-botao-selo:hover .selo{filter:brightness(1.05)}
.sel-botao-selo:focus-visible{outline:2px solid var(--amarelo);outline-offset:2px}
.sel-botao-selo .seta-b{margin:0;font-size:16px;color:var(--gelo)}
.n-total{font-family:var(--f-mono);font-size:11px;background:#141933;color:#fff;padding:1px 7px;border-radius:99px}
.sel-grade{display:grid;grid-template-columns:repeat(auto-fill,176px);gap:8px;width:min(760px,calc(100vw - 300px));max-height:460px;padding:12px}
.op-selo{all:unset;cursor:pointer;border-radius:12px}
.op-selo .selo{opacity:.92}
.op-selo:hover .selo{opacity:1;box-shadow:0 4px 12px rgba(20,25,51,.16)}
.op-selo.on .selo{opacity:1;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--amarelo)}
.op-selo:focus-visible{outline:2px solid var(--amarelo);outline-offset:2px}
.op-grupo{grid-column:1/-1;margin-top:6px}
.op-grupo .selo-grupo .selo{width:120px;height:28px;box-shadow:none}
.op-grupo .selo-grupo .s-ml img{height:20px} .op-grupo .selo-grupo .s-sp img,.op-grupo .selo-grupo .s-am img{height:15px} .op-grupo .selo-grupo .s-mg img{height:18px} .op-grupo .selo-grupo .s-tt img{height:14px}
.op-grupo .selo-grupo .s-pj b,.op-grupo .selo-grupo .s-tt b{font-size:12px} .op-grupo .selo-grupo .s-pj small{display:none}
.sel-grade .sel-ajustes{grid-column:1/-1;bottom:-12px}
@media (max-width:860px){.sel-grade{width:calc(100vw - 48px);grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.abas-contas{margin-top:-6px;flex:1 1 100%;min-width:0}
.s-conta{justify-content:flex-start;gap:10px;padding:0 14px}
.s-conta .bola{width:11px;height:11px;box-shadow:0 0 0 2px #fff}
.s-conta-t{display:flex;flex-direction:column;align-items:flex-start;min-width:0;line-height:1.15}
.s-conta-t b{font-size:14px;font-weight:800;max-width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-conta-t small{font-size:10.5px;font-weight:600;opacity:.85;max-width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-ajustes{background:var(--cartao);color:var(--amarelo);border:1.5px dashed var(--amarelo-borda);font-weight:800;font-size:14px;opacity:1}
.chips-conta{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 100%}
.chip-c{all:unset;cursor:pointer;box-sizing:border-box;display:inline-flex;align-items:center;gap:8px;min-width:150px;height:38px;padding:0 14px;border-radius:12px;background:var(--fc);color:var(--ft);font-size:13.5px;opacity:.62;transition:opacity .15s,box-shadow .15s}
.chip-c b{font-weight:700;white-space:nowrap}
.chip-c .bola{width:10px;height:10px;box-shadow:0 0 0 2px #fff}
.chip-c:hover{opacity:.9}
.chip-c[aria-selected="true"]{opacity:1;box-shadow:0 6px 16px rgba(20,25,51,.2),0 0 0 2px #fff,0 0 0 4px var(--fc)}
.chip-c:focus-visible{outline:2px solid var(--amarelo);outline-offset:3px}
.chip-c.todas{--fc:#141933;--ft:#fff;justify-content:space-between}
.chip-c.todas small{font-family:var(--f-mono);font-size:11px;background:rgba(255,255,255,.18);padding:1px 7px;border-radius:99px}
.chip-c.ajustes{--fc:var(--cartao);--ft:var(--amarelo);border:1.5px dashed var(--amarelo-borda);opacity:1;min-width:0;font-weight:700}
.chip-c.ajustes:hover{background:var(--amarelo-fundo)}
.sel-conta{position:relative}
.sel-botao{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;min-width:280px;box-sizing:border-box;padding:10px 14px;border-radius:10px;background:var(--cartao);border:1.5px solid var(--linha);font-weight:600;font-size:14px}
.sel-botao:hover{border-color:var(--prata)}
.sel-botao:focus-visible{outline:2px solid var(--amarelo);outline-offset:2px}
.seta-b{margin-left:auto;color:var(--apagado)}
.sel-lista{position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:340px;max-height:420px;overflow:auto;background:var(--cartao);border-radius:14px;padding:6px;box-shadow:0 14px 40px rgba(20,25,51,.18),0 2px 6px rgba(20,25,51,.08);border:1px solid var(--linha);display:flex;flex-direction:column}
.sel-op{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:14px}
.sel-op small{margin-left:auto;font-size:11.5px;color:rgb(var(--cr));font-weight:600}
.sel-op:hover,.sel-op:focus-visible{background:var(--coluna)}
.sel-op.on{background:var(--amarelo-fundo);font-weight:700}
.sel-op .bola{width:10px;height:10px}
.sel-ajustes{all:unset;cursor:pointer;margin-top:6px;padding:11px 12px;border-top:1px solid var(--linha);position:sticky;bottom:-6px;background:var(--cartao);font-size:13.5px;font-weight:700;color:var(--amarelo)}
.sel-ajustes:hover{background:var(--amarelo-fundo);border-radius:9px}
.legenda-saude{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--prata);align-items:center}
.legenda-saude span{display:flex;align-items:center;gap:6px}
.legenda-saude i{width:9px;height:9px;border-radius:50%;background:rgb(var(--cr))}
.aj-lista{display:flex;flex-direction:column;max-height:55vh;overflow:auto;border:1px solid var(--linha);border-radius:12px}
.aj-l{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--linha)}
.aj-l:first-child{border-top:none}
.aj-n{display:flex;flex-direction:column;flex:1;min-width:0}
.aj-n small{font-size:11.5px;color:var(--apagado)}
.aj-cores{display:flex;gap:6px}
.aj-cor{all:unset;cursor:pointer;width:22px;height:22px;border-radius:50%;background:rgba(var(--cr),.25);border:2px solid rgba(var(--cr),.5)}
.aj-cor.on{background:rgb(var(--cr));border-color:rgb(var(--cr));box-shadow:0 0 0 3px rgba(var(--cr),.25)}
.aj-cor:focus-visible{outline:2px solid var(--amarelo);outline-offset:2px}
.aj-rm{all:unset;cursor:pointer;padding:2px 8px;border-radius:8px;color:var(--apagado);font-size:18px;line-height:1}
.aj-rm:hover{color:var(--vermelho);background:var(--vermelho-fundo)}
.aj-rm.armado{font-size:12.5px;font-weight:700;color:#fff;background:var(--vermelho)}
.conta-c{background:var(--cartao);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;box-shadow:0 8px 22px rgba(30,111,217,.12),0 1px 3px rgba(30,111,217,.08);border:1px solid transparent}
.conta-c:hover{border-color:var(--amarelo-borda)}
.conta-c:focus-visible{outline:2px solid var(--amarelo);outline-offset:2px}
.conta-t{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.conta-t b{font-size:15.5px}
.conta-c p{margin:0;font-size:13px;color:var(--prata)}
.pill.mono-p{text-transform:none;letter-spacing:0}
/* ---------- principal ---------- */
.principal{min-width:0;display:flex;flex-direction:column}
.topo{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-block:22px 18px;border-bottom:1px solid var(--linha);padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.topo .eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--amarelo)}
.topo h1{margin:4px 0 0;font-family:var(--f-titulo);font-weight:900;font-size:26px;letter-spacing:-.01em;text-transform:uppercase;line-height:1.05;text-wrap:balance}
.topo .esq{min-width:0}
.topo .dir{margin-left:auto;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.seg{display:flex;background:var(--cartao);border:1px solid var(--linha);border-radius:99px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:7px 14px;border-radius:99px;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--prata)}
.seg button[aria-pressed="true"]{background:var(--amarelo);color:var(--onix)}
.seg button:focus-visible{outline:2px solid var(--amarelo);outline-offset:2px}
.rotulo{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--prata)}
.conteudo{padding-block:22px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:26px;min-width:0}
/* ---------- peças ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{box-shadow:var(--sombra);background:var(--cartao);border:1px solid var(--linha);border-top:3px solid var(--prata);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi.am{border-top-color:var(--amarelo)} .kpi.vd{border-top-color:var(--verde)} .kpi.vm{border-top-color:var(--vermelho)} .kpi.az{border-top-color:var(--azul)}
.kpi .v{font-family:var(--f-titulo);font-weight:900;font-size:34px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:16px;color:var(--prata);font-weight:700}
.kpi.am .v{color:var(--gelo)} .kpi.vd .v{color:var(--verde)} .kpi.vm .v{color:var(--vermelho)}
.kpi .s{font-size:12px;color:var(--prata)}
.alerta{background:var(--vermelho-fundo);border:1px solid var(--vermelho-borda);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.alerta b{color:var(--vermelho);text-transform:uppercase;font-size:13px;letter-spacing:.03em}
.alerta.am{background:var(--amarelo-fundo);border-color:var(--amarelo-borda)}
.alerta.am b{color:var(--amarelo)}
.secao{display:flex;flex-direction:column;gap:12px;min-width:0}
.secao-t{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.secao-t h2{margin:0;font-family:var(--f-titulo);font-weight:900;font-size:17px;text-transform:uppercase;letter-spacing:.02em}
.secao-t span{font-size:12px;color:var(--apagado)}
.secao-t .acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.grade2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:14px}
.grade3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.bloco{box-shadow:var(--sombra);background:var(--cartao);border:1px solid var(--linha);border-top:2px solid var(--amarelo);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.bloco.pr{border-top-color:var(--prata)}
.bloco-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.bloco-h .big{font-family:var(--f-titulo);font-weight:900;font-size:24px;font-variant-numeric:tabular-nums}
.barra{height:8px;border-radius:99px;background:var(--trilho);overflow:hidden}
.barra i{display:block;height:100%;border-radius:99px;background:var(--amarelo)}
.linha-p{display:grid;grid-template-columns:minmax(90px,150px) 1fr 52px;gap:12px;align-items:center;font-size:13px}
.linha-p b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linha-p .barra{height:4px}
.linha-p .q{font-family:var(--f-mono);font-size:12px;text-align:right;color:var(--prata);font-variant-numeric:tabular-nums}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--linha);cursor:pointer}
.item:first-of-type{border-top:none}
.item:hover .it{color:var(--amarelo)}
.item:focus-visible{outline:2px solid var(--amarelo);outline-offset:2px}
.cod{font-family:var(--f-titulo);font-weight:900;font-style:italic;color:var(--amarelo);font-size:15px}
.it{font-weight:600;overflow-wrap:anywhere}
.is{font-size:12px;color:var(--apagado);margin-top:2px}
.is.vm{color:var(--vermelho)}
.vazio{color:var(--apagado);font-size:13px;padding:6px 0}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid var(--linha);color:var(--prata);white-space:nowrap}
.pill.critica{color:var(--vermelho);border-color:var(--vermelho-borda);background:var(--vermelho-fundo)}
.pill.alta{color:var(--laranja);border-color:var(--laranja-borda);background:var(--laranja-fundo)}
.pill.media{color:var(--azul);border-color:var(--azul-borda);background:var(--azul-fundo)}
.pill.ok{color:var(--verde);border-color:var(--verde-borda);background:var(--verde-fundo)}
.pill.and{color:var(--amarelo);border-color:var(--amarelo-borda)}
.pill.esp{color:var(--azul);border-color:var(--azul-borda)}
.pill.blq{color:var(--vermelho);border-color:var(--vermelho-borda)}
.pill.resp{background:var(--gelo);color:var(--onix);border-color:var(--gelo)}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:8px;font-weight:800;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;background:var(--amarelo);color:var(--onix);white-space:nowrap}
.btn.sec{background:transparent;color:var(--gelo);border:1px solid var(--linha);font-weight:700}
.btn.sec:hover{border-color:var(--prata)}
.btn.perigo{background:var(--vermelho);color:var(--onix)}
.btn:focus-visible{outline:2px solid var(--amarelo);outline-offset:2px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filtros select,.filtros input{font:inherit;font-size:13px;background:var(--cartao);color:var(--gelo);border:1px solid var(--linha);border-radius:8px;padding:8px 10px;min-width:0}
.filtros input{flex:1 1 200px}
/* ---------- kanban ---------- */
.kanban-wrap{overflow-x:auto;padding-bottom:6px}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:12px;align-items:start}
.col{background:var(--coluna);border:1px solid var(--linha);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:160px}
.col.over{outline:2px dashed var(--amarelo);outline-offset:-2px}
.col-h{display:flex;align-items:center;gap:8px;padding:2px 4px 6px;border-bottom:2px solid var(--prata)}
.col-h.and{border-color:var(--amarelo)} .col-h.esp{border-color:var(--azul)} .col-h.ok{border-color:var(--verde)}
.col-h b{font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.col-h .q{font-family:var(--f-mono);font-size:11px;color:var(--apagado)}
.col-h button{all:unset;cursor:pointer;margin-left:auto;font-size:18px;line-height:1;color:var(--apagado);padding:0 5px;border-radius:4px}
.col-h button:hover{color:var(--amarelo)}
.card{box-shadow:var(--sombra);background:var(--cartao2);border:1px solid var(--linha);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.card:hover{border-color:var(--prata)}
.card:focus-visible{outline:2px solid var(--amarelo);outline-offset:1px}
.card.blq{border-left:3px solid var(--vermelho)}
.card.arrastando{opacity:.4}
.card .top{display:flex;gap:8px;align-items:baseline}
.card .area{font-family:var(--f-mono);font-size:10.5px;color:var(--apagado);text-transform:uppercase;letter-spacing:.08em}
.card .chk{font-family:var(--f-mono);font-size:11px;color:var(--prata)}
/* ---------- tabela ---------- */
.tabela-wrap{box-shadow:var(--sombra);overflow-x:auto;border:1px solid var(--linha);border-radius:10px;background:var(--cartao)}
table{width:100%;border-collapse:collapse;min-width:720px}
th{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--prata);text-align:left;padding:10px 12px;border-bottom:1px solid var(--linha);white-space:nowrap}
th button{all:unset;cursor:pointer}
th button:hover{color:var(--amarelo)}
td{padding:10px 12px;border-bottom:1px solid var(--linha);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
td select{font:inherit;font-size:12.5px;background:var(--cartao2);color:var(--gelo);border:1px solid var(--linha);border-radius:6px;padding:5px 6px}
.mono{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--prata);white-space:nowrap}
/* ---------- dependências ---------- */
.dep{background:var(--cartao);border:1px solid var(--linha);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.dep-seta{display:flex;flex-direction:column;gap:6px;padding-left:14px;border-left:2px solid var(--linha)}
.dep-seta .d{display:flex;gap:8px;align-items:baseline;cursor:pointer}
.dep-seta .d.aberta .cod{color:var(--vermelho)}
.dep-seta .d.feita .cod{color:var(--verde)}
/* ---------- registro ---------- */
.reg{display:flex;flex-direction:column}
.reg-i{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:10px 0;border-top:1px solid var(--linha)}
.reg-i:first-child{border-top:none}
.reg-i .q{font-family:var(--f-mono);font-size:11.5px;color:var(--prata)}
.reg-i.nota .t{color:var(--amarelo)}
.reg-i .a{font-size:12px;color:var(--apagado)}
.nota-form{display:flex;gap:8px;flex-wrap:wrap}
.nota-form input{flex:1 1 260px;font:inherit;background:var(--cartao);color:var(--gelo);border:1px solid var(--linha);border-radius:8px;padding:9px 12px;min-width:0}
/* ---------- formulários e ficha ---------- */
dialog{border:1px solid var(--linha);border-radius:12px;padding:0;background:var(--onix);color:var(--gelo);width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(20,25,51,.45)}
.ficha{display:flex;flex-direction:column;gap:14px;padding:20px}
.ficha-h{display:flex;gap:10px;align-items:baseline}
.ficha-h h3{margin:0;font-family:var(--f-titulo);font-weight:900;font-size:19px;text-transform:uppercase}
.ficha-h .x{all:unset;cursor:pointer;margin-left:auto;font-size:22px;line-height:1;color:var(--apagado);padding:0 4px}
.campo{display:flex;flex-direction:column;gap:5px;min-width:0}
.campo label,.campo .rotulo{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--prata)}
.campo input,.campo select,.campo textarea{font:inherit;background:var(--cartao);color:var(--gelo);border:1px solid var(--linha);border-radius:8px;padding:9px 10px;min-width:0}
.campo textarea{min-height:80px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus,.nota-form input:focus,.filtros input:focus,.filtros select:focus{outline:2px solid var(--amarelo);outline-offset:0;border-color:transparent}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:560px){.g2,.g3{grid-template-columns:1fr}}
.checklist{display:flex;flex-direction:column;gap:6px}
.ck{display:flex;gap:8px;align-items:center}
.ck input[type=checkbox]{accent-color:var(--amarelo);width:16px;height:16px}
.ck span{flex:1;overflow-wrap:anywhere}
.ck.feito span{color:var(--apagado);text-decoration:line-through}
.ck button{all:unset;cursor:pointer;color:var(--apagado);padding:0 6px}
.ck-add{display:flex;gap:6px}
.ck-add input{flex:1}
.deps{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow:auto;border:1px solid var(--linha);border-radius:8px;padding:8px 10px;background:var(--cartao)}
.deps label{display:flex;gap:8px;align-items:baseline;font-family:var(--f-texto);font-size:13px;letter-spacing:0;text-transform:none;color:var(--gelo);cursor:pointer}
.deps input{accent-color:var(--amarelo)}
.ficha-a{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:4px;border-top:1px solid var(--linha);padding-block:14px 0}
.ficha-a .sp{flex:1}
.carimbo{font-family:var(--f-mono);font-size:11px;color:var(--apagado)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gelo);color:var(--onix);font-weight:600;padding:10px 16px;border-radius:8px;font-size:13px;z-index:40;max-width:calc(100vw - 32px)}
.risco{background:var(--cartao);border:1px solid var(--linha);border-left:3px solid var(--prata);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.risco.materializou{border-left-color:var(--vermelho)} .risco.resolvido{border-left-color:var(--verde)} .risco.vigiando{border-left-color:var(--amarelo)}
.risco p{margin:0;color:var(--prata);font-size:13px}
.aviso{font-size:13px;color:var(--prata);background:var(--cartao);border:1px dashed var(--linha);border-radius:10px;padding:12px 14px}
/* ---------- celular ---------- */
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .lateral{position:sticky;height:auto;flex-direction:column;z-index:20;padding-left:0;border-right:none;border-bottom:1px solid var(--linha)}
  .marca{flex-direction:row;align-items:center;padding:10px max(16px,env(safe-area-inset-left,0px)) 6px}
  .marca .logo{width:112px}
  .fio,.rodape-lateral{display:none}
  .nav{flex-direction:row;overflow-x:auto;padding:0 max(10px,env(safe-area-inset-left,0px)) 8px;gap:4px}
  .nav button{padding:8px 10px;font-size:12px;white-space:nowrap}
  .topo,.conteudo{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topo .dir{margin-left:0}
  .linha-p{grid-template-columns:110px 1fr 44px}
  .reg-i{grid-template-columns:1fr;gap:2px}
}
@media (prefers-reduced-motion:no-preference){.barra i{transition:width .4s ease}}

/* ======================= versões de design (data-tema no <html>) ======================= */
/* 1 · Branco: tudo branco, menu claro, logo como selo */
[data-tema="branco"]{--fundo:#FFFFFF;--coluna:#F4F6FA}
[data-tema="branco"] .lateral{background:#F7F9FC;border-right:1px solid #E3E8F0;--gelo:#141933;--prata:#56607A;--apagado:#8590A3;--cartao:#FFFFFF;--linha:#E3E8F0;--amarelo:#1E6FD9;--amarelo-fundo:#E6F0FD;--amarelo-borda:#B8D3F7;color-scheme:light}
[data-tema="branco"] .kpi{border-top:1px solid var(--linha);box-shadow:none}
[data-tema="branco"] .bloco{border-top:1px solid var(--linha);box-shadow:none}
[data-tema="branco"] .topo{border-bottom-color:#EEF1F5}

/* 2 · Menu em cima: faixa azul-marinho no topo, tela inteira para o conteúdo */
@media (min-width:861px){
[data-tema="topo"] .app{grid-template-columns:1fr}
[data-tema="topo"] .lateral{position:sticky;height:auto;flex-direction:row;align-items:center;gap:20px;z-index:20;padding:0 max(24px,env(safe-area-inset-left,0px));border-right:none}
[data-tema="topo"] .marca{flex-direction:row;align-items:center;padding:6px 0}
[data-tema="topo"] .marca .logo{width:96px}
[data-tema="topo"] .marca .sub,[data-tema="topo"] .fio{display:none}
[data-tema="topo"] .nav{flex-direction:row;padding:0;gap:2px;flex:1}
[data-tema="topo"] .nav button{padding:10px 12px;border-radius:8px}
[data-tema="topo"] .rodape-lateral{margin:0;border:none;padding:0}
[data-tema="topo"] .rodape-lateral > span:first-child{display:none}
}
[data-tema="topo"]{--fundo:#EEF2F8}

/* 3 · Royal: menu azul forte, fundo azulado, números em azul */
[data-tema="royal"]{--fundo:#EEF3FC;--amarelo:#0E5BD8;--amarelo-fundo:#E3EDFD;--coluna:#E2EAF7;--linha:#D5DFEE}
[data-tema="royal"] .lateral{background:linear-gradient(180deg,#0F48B8,#0A2E78);--cartao:rgba(255,255,255,.08);--linha:rgba(255,255,255,.14);--amarelo:#FFFFFF;--amarelo-fundo:rgba(255,255,255,.16);--amarelo-borda:rgba(255,255,255,.3);--prata:#C9D8F5;--apagado:#9FB6E3}
[data-tema="royal"] .fio{background:rgba(255,255,255,.25)}
[data-tema="royal"] .kpi{border-top:none;border-left:4px solid var(--prata)}
[data-tema="royal"] .kpi.am{border-left-color:var(--amarelo)} [data-tema="royal"] .kpi.vd{border-left-color:var(--verde)} [data-tema="royal"] .kpi.vm{border-left-color:var(--vermelho)} [data-tema="royal"] .kpi.az{border-left-color:var(--azul)}
[data-tema="royal"] .kpi .v{color:var(--amarelo)}
[data-tema="royal"] .kpi.vm .v{color:var(--vermelho)} [data-tema="royal"] .kpi.vd .v{color:var(--verde)}
[data-tema="royal"] .bloco{border-top:3px solid var(--amarelo)}

/* 4 · Suave: cantos bem redondos, sombras macias, títulos sem caixa-alta, letra maior */
[data-tema="suave"]{--fundo:#F4F6FB;--coluna:#EBEFF6;--sombra:0 6px 20px rgba(20,25,51,.06),0 1px 2px rgba(20,25,51,.04)}
[data-tema="suave"] body{font-size:15px}
[data-tema="suave"] .kpi,[data-tema="suave"] .bloco,[data-tema="suave"] .tabela-wrap,[data-tema="suave"] .col,[data-tema="suave"] .risco,[data-tema="suave"] .dep,[data-tema="suave"] .alerta{border-radius:18px;border:none;box-shadow:var(--sombra)}
[data-tema="suave"] .card{border-radius:12px;border:1px solid #EDF0F5}
[data-tema="suave"] .col{box-shadow:none}
[data-tema="suave"] .kpi{border-top:none;padding:18px 20px}
[data-tema="suave"] .kpi .rotulo::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--prata);margin-right:8px;vertical-align:1px}
[data-tema="suave"] .kpi.am .rotulo::before{background:var(--amarelo)} [data-tema="suave"] .kpi.vd .rotulo::before{background:var(--verde)} [data-tema="suave"] .kpi.vm .rotulo::before{background:var(--vermelho)} [data-tema="suave"] .kpi.az .rotulo::before{background:var(--azul)}
[data-tema="suave"] .bloco{border-top:none;padding:20px}
[data-tema="suave"] .topo h1,[data-tema="suave"] .secao-t h2{text-transform:none;letter-spacing:-.01em}
[data-tema="suave"] .topo h1{font-size:30px;font-weight:800}
[data-tema="suave"] .secao-t h2{font-size:19px;font-weight:800}
[data-tema="suave"] .nav button{text-transform:none;letter-spacing:0;font-size:14.5px;font-weight:600;border-radius:12px}
[data-tema="suave"] .topo{border-bottom:none}
[data-tema="suave"] .btn{border-radius:12px;text-transform:none;letter-spacing:0;font-size:14px}

/* 6 · Fynix: referência do Behance escolhida pelo Luciano (21/10). Menu lateral branco, um único cartão de destaque
   cheio de cor (azul LealPharma), o resto neutro, branco e arejado, letras leves sem caixa-alta. Logo igual. */
[data-tema="fynix"]{--fundo:#F2F4F7;--cartao:#FFFFFF;--cartao2:#F8F9FB;--coluna:#F2F4F7;--linha:#E7EAF0;--hover:#F8F9FB;--trilho:#EDF0F4;
  --gelo:#101828;--prata:#5D6679;--apagado:#98A2B3;--amarelo:#1E6FD9;--amarelo-fundo:#EAF2FD;--amarelo-borda:#CFE0F8;
  --f-titulo:"Barlow Condensed","Arial Narrow",sans-serif;--f-texto:"Barlow","Segoe UI",Arial,sans-serif;  /* mesmas fontes do painel da M7 (Luciano, 21/10) */
  --sombra:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06)}
[data-tema="fynix"] body{font-size:14.5px}
[data-tema="fynix"] body::before{background:#fff}
/* menu lateral branco */
[data-tema="fynix"] .lateral{background:#fff;border-right:1px solid #EEF0F4;--gelo:#101828;--prata:#475467;--apagado:#98A2B3;--cartao:#F2F4F7;--linha:#EEF0F4;--amarelo:#1E6FD9;--amarelo-fundo:#F2F4F7;--amarelo-borda:transparent;color-scheme:light}
[data-tema="fynix"] .marca{align-items:flex-start;padding:24px 20px 10px}

/* tela de entrada: quem está usando o painel (Luciano, 21/10). Sem senha: o acesso de verdade é o compartilhamento do Claude */
.entrada{position:fixed;inset:0;z-index:80;background:#060815;color:#F1F4FA;display:grid;place-items:center;padding:24px 16px;overflow:auto;animation:e-entra .25s ease-out}
.entrada.saindo{animation:e-sai .22s ease-in forwards}
@keyframes e-entra{from{opacity:0}to{opacity:1}} @keyframes e-sai{to{opacity:0;transform:scale(1.02)}}
.entrada-fundo{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.entrada-c{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;width:min(520px,100%)}
.entrada .logo{width:190px;height:auto;color:#F1F4FA;margin-bottom:4px}

.entrada h2{margin:34px 0 4px;font-family:var(--f-titulo);font-size:30px;font-weight:700;letter-spacing:-.01em}
.entrada p{margin:0;color:#8D97B0;font-size:14px}
.entrada-op{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%;margin-top:24px}
.entrada-op button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 12px 24px;border-radius:20px;background:#161B36;border:1.5px solid #252C50;transition:transform .15s,border-color .15s,background .15s,box-shadow .15s}
.entrada-op button:hover{transform:translateY(-3px);border-color:#4DA3FF;background:#233466;box-shadow:0 14px 30px -12px rgba(0,0,0,.5)}
.entrada-op button:focus-visible{outline:2px solid #4DA3FF;outline-offset:3px}
/* luz de fundo em volta de cada cartão, na cor da pessoa; aumenta com o mouse em cima (Luciano, 21/10) */
.entrada-op button[data-quem="Luciano"]{--luz:30,111,217} .entrada-op button[data-quem="Adrian"]{--luz:106,75,209}
.entrada-op button{box-shadow:0 0 26px -6px rgba(var(--luz),.45),0 0 70px -12px rgba(var(--luz),.3);transition:transform .2s,border-color .2s,background .2s,box-shadow .3s ease}
/* parada, a luz pulsa devagar; o Adrian vai meio passo atrás do Luciano */
.entrada-op button{animation:cartao-pulsa 4.5s ease-in-out infinite}
.entrada-op button[data-quem="Adrian"]{animation-delay:-2.25s}
@keyframes cartao-pulsa{0%,100%{box-shadow:0 0 22px -8px rgba(var(--luz),.35),0 0 60px -14px rgba(var(--luz),.2)}50%{box-shadow:0 0 32px -2px rgba(var(--luz),.6),0 0 90px 4px rgba(var(--luz),.32)}}
@media (prefers-reduced-motion: reduce){.entrada-op button{animation:none}}
.entrada-op button:hover,.entrada-op button:focus-visible{animation:none;border-color:rgb(var(--luz));background:linear-gradient(rgba(var(--luz),.16),rgba(var(--luz),.16)),#161B36;box-shadow:0 0 34px 2px rgba(var(--luz),.7),0 0 110px 18px rgba(var(--luz),.4)}
.entrada-op button[aria-pressed="true"]{border-color:#4DA3FF}

.entrada-op small{font-size:12.5px;color:#8D97B0;margin-top:-8px}

.entrada .fechar{all:unset;cursor:pointer;margin-top:6px;font-size:13px;color:#AEB7CC;padding:6px 10px;border-radius:8px}
.entrada .fechar:hover{color:#fff;background:#1F2647}
/* título da entrada: acende de um clarão azul, uma faixa de luz varre as letras e o brilho pulsa (Luciano, 21/10).
   O texto fica inteiro (letra separada em span perdia o encaixe e deixava resto de desfoque) */
.entrada h2{background:linear-gradient(100deg,#F1F4FA 0%,#F1F4FA 42%,#BFE0FF 50%,#F1F4FA 58%,#F1F4FA 100%);background-size:260% 100%;background-position:100% 0;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:tt-sai 1.1s cubic-bezier(.2,.8,.2,1) .15s backwards,tt-varre 5s ease-in-out 1.4s infinite,tt-brilho 3.6s ease-in-out 1.4s infinite}
@keyframes tt-sai{0%{opacity:0;filter:blur(12px) drop-shadow(0 0 30px #4DA3FF);transform:scale(1.08)}60%{opacity:1;filter:blur(0) drop-shadow(0 0 22px #4DA3FF)}100%{filter:drop-shadow(0 0 8px rgba(77,163,255,.45))}}
@keyframes tt-varre{0%{background-position:100% 0}45%,100%{background-position:0 0}}
@keyframes tt-brilho{0%,100%{filter:drop-shadow(0 0 6px rgba(77,163,255,.4))}50%{filter:drop-shadow(0 0 14px rgba(77,163,255,.85)) drop-shadow(0 0 30px rgba(77,163,255,.3))}}
.entrada .logo{animation:logo-sai 1.1s ease-out both,logo-brilho 3.6s ease-in-out 1.4s infinite}
@keyframes logo-sai{from{opacity:0;filter:blur(8px) drop-shadow(0 0 24px #4DA3FF)}to{opacity:1;filter:blur(0) drop-shadow(0 0 8px rgba(77,163,255,.35))}}
@keyframes logo-brilho{0%,100%{filter:drop-shadow(0 0 6px rgba(77,163,255,.3))}50%{filter:drop-shadow(0 0 16px rgba(77,163,255,.7))}}
.entrada .sub,.entrada .entrada-c > p{animation:le-fade .8s ease-out .9s both}
@keyframes le-fade{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:none}}
@media (prefers-reduced-motion: reduce){.entrada h2,.entrada .logo,.entrada .sub,.entrada .entrada-c > p{animation:none}.entrada h2{filter:drop-shadow(0 0 8px rgba(77,163,255,.45))}}

  document.documentElement.dataset.tema = t || "fynix";  /* padrão desde 21/10: Fynix com as fontes da M7 e menu azul-marinho (Luciano) */
  let m = null; try { m = new URLSearchParams(location.search).get("menu") || localStorage.getItem("lp2.menu"); } catch(e) {}
  document.documentElement.dataset.menu = m || "escuro"; })();  /* padrão: Grande e nítido (Luciano, 21/10) */
/* ======================= constantes ======================= */
const STATUS = [

  { id:"andamento", nome:"Em andamento", cls:"and" },
  { id:"esperando", nome:"Esperando",    cls:"esp" },
  { id:"concluido", nome:"Concluída",    cls:"ok" },
];
const PRIOR = [
  { id:"critica", nome:"Crítica", peso:0 }, { id:"alta", nome:"Alta", peso:1 },
  { id:"media", nome:"Média", peso:2 }, { id:"baixa", nome:"Baixa", peso:3 },
];

const AREAS = ["Anúncios","Preços e promoções","Reclamações","Envios","Criativos","Produtos novos","Financeiro","Automação","Outros"];
/* frentes = onde a tarefa acontece (canal ou projeto). A lista se edita na aba Projeto */
const FRENTES_PADRAO = ["Mercado Livre","Projeto ML · parceiros","Shopee","TikTok Shop","Americanas","Magalu"];
/* cores de cada canal nas abas e nos caixotes (Luciano, 21/10): mc = faixa, mf = fundo da aba, mt = texto da aba, mp = número do progresso, mn = texto do contador */
const MARCAS = {
  "Mercado Livre": { mc:"#FFE600", mf:"#FFF8C2", mt:"#2D3277", mp:"#2D3277", mn:"#2D3277" },
  "Projeto ML · parceiros": { mc:"#1E6FD9", mf:"#E6F0FD", mt:"#0B4FB3", mp:"#1E6FD9", mn:"#FFFFFF" },
  "Shopee":        { mc:"#EE4D2D", mf:"#FDECE8", mt:"#D73211", mp:"#EE4D2D", mn:"#FFFFFF" },

const MARCAS_PADRAO = { ...MARCAS };
/* cor de frente escolhida na aba Projeto (Luciano 21/10): o painel tira dela o fundo claro, o texto e a cor do número */
const hexRgb = h => [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgbHex = a => "#" + a.map(x => Math.round(Math.max(0, Math.min(255, x))).toString(16).padStart(2, "0")).join("").toUpperCase();
const misturar = (h, alvo, t) => { const a = hexRgb(h), b = hexRgb(alvo); return rgbHex(a.map((x, i) => x + (b[i] - x) * t)); };
const luz = h => { const [r, g, b] = hexRgb(h).map(x => { x /= 255; return x <= .03928 ? x / 12.92 : ((x + .055) / 1.055) ** 2.4; }); return .2126 * r + .7152 * g + .0722 * b; };
function marcaDeCor(c){
  const claro = luz(c) > .4;  /* amarelo, laranja: texto escuro em cima */
  const mt = claro ? "#141933" : misturar(c, "#000000", .2);
  return { mc:c, mf:misturar(c, "#FFFFFF", .88), mt, mp: claro ? mt : c, mn: claro ? "#141933" : "#FFFFFF" };
}
function aplicarCores(){
  for (const k of Object.keys(MARCAS)) delete MARCAS[k];
  Object.assign(MARCAS, MARCAS_PADRAO);
  for (const [f, cor] of Object.entries(S.projeto.cores || {})) if (/^#[0-9a-f]{6}$/i.test(cor)) MARCAS[f] = marcaDeCor(cor);
}

/* Americanas e Magalu entram depois do TikTok Shop também numa lista salva antes (Luciano, 21/10); tirando na aba Projeto, não voltam (frentesV2) */
function listaBase(){
  if (!Array.isArray(S.projeto.frentes)) return [...FRENTES_PADRAO];
  const l = [...S.projeto.frentes];
  if (!S.projeto.frentesV2) for (const f of ["Americanas","Magalu"]) if (!l.includes(f)) {
    const ant = l.indexOf(f === "Magalu" && l.includes("Americanas") ? "Americanas" : "TikTok Shop");
    l.splice(ant >= 0 ? ant + 1 : l.length, 0, f);
  }
  return l;
}
function frentes(){
  const base = listaBase();
  const usadas = S.tarefas.map(t => t.frente).filter(Boolean);
  const l = [...new Set([...base, ...usadas])];
  if (S.tarefas.some(t => !t.frente)) l.push("Geral");
  /* Projeto ML sempre ao lado do Mercado Livre, mesmo numa lista salva antes (Luciano, 21/10) */
  const ml = l.indexOf("Mercado Livre"), pj = l.indexOf("Projeto ML · parceiros");
  if (ml >= 0 && pj >= 0 && pj !== ml + 1) { l.splice(pj, 1); l.splice(l.indexOf("Mercado Livre") + 1, 0, "Projeto ML · parceiros"); }
  return l;
}

async function nomeDe(id){
  if (!id) return "";
  if (S.nomes[id] !== undefined) return S.nomes[id];
  try { const ps = await S.user.profiles([id]); S.nomes[id] = (ps[id] && ps[id].name) || ""; } catch(e) { S.nomes[id] = ""; }
  return S.nomes[id];
}
async function registrar(texto, tipo){
  if (!S.db) return;
  try { await S.db.collection("registro").add({ texto, tipo: tipo || "auto", quando: Date.now(), autor: S.meuId || "", quem: S.quem || "" }); } catch(e) {}
}
function falhou(err){
  if (err && err.code === "invalid_argument") { S.pode = false; render(); toast("Você só pode ver este painel. Peça acesso de edição ao Luciano."); }
  else if (err && err.code === "quota_exceeded") toast("O painel encheu. Apague registros antigos e tente de novo.");
  else toast("Não salvou. Tente de novo em instantes.");
}
async function salvarTarefa(id, dados, antigo){
  if (!S.db) return toast("Sem conexão com os dados. Recarregue a página.");
  dados.atualizadoEm = Date.now();
  if (antigo && dados.status && dados.status !== antigo.status) {
    if (dados.status === "andamento" && !antigo.iniciadaEm) dados.iniciadaEm = hoje();
    if (dados.status === "concluido") dados.concluidaEm = hoje();
    if (antigo.status === "concluido" && dados.status !== "concluido") dados.concluidaEm = "";
  }
  try {
    if (!id) {
      const n = Math.max(0, ...S.tarefas.map(t => codNum(t.codigo))) + 1;
      dados.codigo = "T" + n; dados.criadoEm = Date.now(); dados.ordem = Date.now();
      if (dados.status === "andamento") dados.iniciadaEm = hoje();
      if (dados.status === "concluido") dados.concluidaEm = hoje();
      await S.db.collection("tarefas").add(dados);
      registrar(`${dados.codigo} criada: ${dados.titulo}`);
      toast("Tarefa criada");
    } else {
      await S.db.collection("tarefas").doc(id).update(dados);
      if (antigo && dados.status && dados.status !== antigo.status) registrar(`${antigo.codigo} foi para ${stNome(dados.status)}: ${antigo.titulo}`);
    }
  } catch(err) { falhou(err); }

function linhaP(nome,f,t){ return `<div class="linha-p"><b title="${esc(nome)}">${esc(nome)}</b><div class="barra"><i style="width:${pct(f,t)}%"></i></div><span class="q">${f} / ${t}</span></div>`; }
function blocoLista(titulo, lista, vazio, trava){

function itemTarefa(t, trava){

/* ======================= vista: kanban ======================= */
function vKanban(){
  const naFrente = S.vista === "frente";
  const lista = S.tarefas.filter(doEscopo)
    .filter(t => naFrente ? frenteDe(t) === S.frenteAtual : (!S.frenteKanban || frenteDe(t) === S.frenteKanban))
    .filter(t => !S.areaKanban || (t.area || "Outros") === S.areaKanban);
  const areas = [...new Set(S.tarefas.map(t => t.area || "Outros"))].sort();
  return `${naFrente ? "" : avisoSemDados() + avisoLeitura()}
  <div class="filtros">
    ${naFrente ? "" : `<select id="kFrente" aria-label="Frente"><option value="">Todas as frentes</option>${frentes().map(f => `<option ${corOpcao(f)} ${f === S.frenteKanban ? "selected" : ""}>${esc(f)}</option>`).join("")}</select>`}
    <select id="kArea" aria-label="Área"><option value="">Todas as áreas</option>${[...new Set([...areas, ...(S.areaKanban ? [S.areaKanban] : [])])].map(a => `<option ${a === S.areaKanban ? "selected" : ""}>${esc(a)}</option>`).join("")}</select>
    <button type="button" class="btn-filtro" id="kAnuncios" aria-pressed="${S.areaKanban === "Anúncios"}" title="Mostrar só as tarefas de anúncios">Anúncios</button>

  </div>
  <div class="kanban-wrap"><div class="kanban">
    ${STATUS.map(s => { const itens = lista.filter(t => (t.status || "pendente") === s.id).sort((a,b) => (a.ordem||0) - (b.ordem||0));
      return `<section class="col" data-col="${s.id}">
        <div class="col-h ${s.cls}"><b>${s.nome}</b><span class="q">${itens.length}</span>${S.pode ? `<button data-nova="${s.id}" aria-label="Nova tarefa em ${s.nome}" title="Nova tarefa">+</button>` : ""}</div>

/* ======================= vista: frente ======================= */
function vFrente(){
  const lista = frentes();
  if (!lista.includes(S.frenteAtual)) S.frenteAtual = lista[0] || "Geral";
  const abertas = f => S.tarefas.filter(doEscopo).filter(t => frenteDe(t) === f && t.status !== "concluido").length;
  const i = lista.indexOf(S.frenteAtual);
  const abas = `<div class="abas-wrap">
    <div class="abas" role="tablist" aria-label="Frentes">${lista.map(f => { const n = abertas(f);

  </div>`;
  return abas + vFrenteCorpo();
}
function vFrenteCorpo(){
  const l = S.tarefas.filter(doEscopo).filter(t => frenteDe(t) === S.frenteAtual);
  const feitas = l.filter(t => t.status === "concluido").length;
  return `${avisoSemDados()}${avisoLeitura()}
  <div class="kpis ${MARCAS[S.frenteAtual] ? "cor-canal" : ""}" ${estiloMarca(S.frenteAtual)}>

    <div class="kpi"><span class="rotulo">Em andamento</span><span class="v">${l.filter(t => t.status === "andamento").length}</span><span class="s">${l.filter(t => t.status === "esperando").length} esperando alguém</span></div>
    <div class="kpi vm"><span class="rotulo">Bloqueadas</span><span class="v">${l.filter(bloqueada).length}</span><span class="s">por dependência aberta</span></div>
  </div>
  ${l.length || carregando() ? "" : `<div class="aviso">Nenhuma tarefa em ${esc(S.frenteAtual)} ainda. Use o + de uma coluna para criar a primeira: ela já entra nesta frente.</div>`}

function irFrente(f){ S.frenteAtual = f; lsSet("lp2.frente", f); render(); }
function passoFrente(d){ const l = frentes(); if (!l.length) return; const i = l.indexOf(S.frenteAtual); irFrente(l[(i + d + l.length) % l.length]); }
/* setas do teclado trocam de frente (fora de campos de texto e da ficha aberta) */
document.addEventListener("keydown", e => {
  if (S.vista !== "frente" || $("dlg").open || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.target.closest && e.target.closest("input,textarea,select,[contenteditable]")) return;
  if (e.key === "ArrowRight") { e.preventDefault(); passoFrente(1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); passoFrente(-1); }
});
function ligarFrente(raiz){
  raiz.querySelectorAll("[data-aba]").forEach(b => b.onclick = () => irFrente(b.dataset.aba));
  raiz.querySelectorAll("[data-passo]").forEach(b => b.onclick = () => passoFrente(+b.dataset.passo));

function cartao(t){

function ligarKanban(raiz){
  const sel = $("kArea"); if (sel) sel.onchange = () => { S.areaKanban = sel.value; render(); };
  const kf = $("kFrente"); if (kf) kf.onchange = () => { S.frenteKanban = kf.value; render(); };
  const ka = $("kAnuncios"); if (ka) ka.onclick = () => { S.areaKanban = S.areaKanban === "Anúncios" ? "" : "Anúncios"; render(); };
  if (!S.pode) return;
  raiz.querySelectorAll(".col > .card").forEach(card => {
    card.addEventListener("pointerdown", e => apertar(raiz, card, e));
    card.addEventListener("keydown", e => teclaCartao(raiz, card, e));
    card.addEventListener("contextmenu", e => { if (KB.ar || KB.segurando) e.preventDefault(); });
  });
  /* depois de soltar pelo teclado o painel redesenha; o foco volta para o cartão */
  if (KB.foco) { const c = raiz.querySelector(`.col > .card[data-id="${CSS.escape(KB.foco)}"]`); if (c) { c.focus({ preventScroll:true }); KB.foco = null; } }

/* ---------- arrasto do kanban ----------
   Feito com pointer events (mouse, caneta e dedo) em vez do arrastar do navegador: o cartão
   sai da coluna e segue o cursor, a vaga tracejada abre onde ele vai cair e os outros cartões
   deslizam até o lugar novo em vez de pular.
   A posição de queda sai de uma foto das colunas tirada sem o cartão e sem a vaga. Medir ao
   vivo faz a vaga empurrar os cartões para além do cursor, a decisão vira e a vaga fica piscando
   entre dois lugares.
   No dedo o cartão só sai depois de segurar um instante, para o toque ainda rolar a página.
   Pelo teclado: espaço pega, setas movem, espaço solta, Esc devolve. */
const KB = { ar:null, pego:null, foco:null, depois:false, segurando:false };
const semMov = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
document.addEventListener("touchmove", e => { if (KB.ar) e.preventDefault(); }, { passive:false });

function anunciar(m){
  let el = $("kAviso");
  if (!el) { el = document.createElement("p"); el.id = "kAviso"; el.className = "k-aviso"; el.setAttribute("role", "status"); el.setAttribute("aria-live", "polite"); document.body.appendChild(el); }
  el.textContent = m;
}
/* anota onde cada cartão estava, muda o DOM e anima cada um até o lugar novo */
function deslizar(raiz, mudar){
  const els = [...raiz.querySelectorAll(".col > .card:not(.k-some), .col > .k-vaga")];
  const antes = new Map(els.map(el => [el, el.getBoundingClientRect()]));
  mudar();
  if (semMov()) return;
  antes.forEach((r, el) => {
    if (!el.isConnected) return;
    const n = el.getBoundingClientRect(); const dx = r.left - n.left, dy = r.top - n.top;
    if (!dx && !dy) return;
    el.style.transition = "none"; el.style.transform = `translate(${dx}px,${dy}px)`;
    el.getBoundingClientRect();
    el.style.transition = "transform .26s cubic-bezier(.2,.9,.3,1.12)"; el.style.transform = "";
    el.addEventListener("transitionend", () => { el.style.transition = ""; }, { once:true });
  });
}
/* contador de cada coluna: mostra onde o cartão vai cair, não de onde saiu */
function contar(raiz){
  raiz.querySelectorAll(".col").forEach(col => {
    const q = col.querySelector(".col-h .q"); if (!q) return;
    const n = String(col.querySelectorAll(":scope > .card:not(.k-some), :scope > .k-vaga").length);
    if (q.textContent !== n) { q.textContent = n; q.classList.remove("k-pula"); void q.offsetWidth; q.classList.add("k-pula"); }
  });
}
/* status e ordem a partir dos vizinhos na coluna; tarefas escondidas pelos filtros não saem do lugar */
function lugarDe(card){
  const id = card.dataset.id; const status = card.parentElement.dataset.col;
  const irmas = S.tarefas.filter(x => (x.status || "pendente") === status && x.id !== id).sort((a,b) => (a.ordem||0) - (b.ordem||0));
  const viz = lado => { let v = card[lado]; while (v && !(v.matches(".card:not(.k-some)") && v.dataset.id !== id)) v = v[lado]; return v; };
  const prox = viz("nextElementSibling"), ant = viz("previousElementSibling");
  const ip = prox ? irmas.findIndex(x => x.id === prox.dataset.id) : -1, ia = ant ? irmas.findIndex(x => x.id === ant.dataset.id) : -1;
  let ordem;
  if (ip > -1) { const d = irmas[ip].ordem||0; ordem = ((ip > 0 ? (irmas[ip-1].ordem||0) : d - 2000) + d) / 2; }
  else if (ia > -1) { const a = irmas[ia].ordem||0; ordem = (a + (ia < irmas.length - 1 ? (irmas[ia+1].ordem||0) : a + 2000)) / 2; }
  else ordem = (irmas.length ? (irmas[irmas.length-1].ordem||0) : 0) + 1000;
  return { status, ordem, prox: prox ? prox.dataset.id : "", ant: ant ? ant.dataset.id : "" };
}
function gravarLugar(card, de){
  const t = porId(card.dataset.id); if (!t) return;
  const l = lugarDe(card);
  if (l.status === de.status && l.prox === de.prox && l.ant === de.ant) return false;
  salvarTarefa(t.id, { status:l.status, ordem:l.ordem }, t);
  return true;
}
const posicao = card => { const col = card.parentElement; return { nome: stNome(col.dataset.col), n: [...col.querySelectorAll(":scope > .card:not(.k-some)")].indexOf(card) + 1 }; };

/* mouse: sai ao mexer 5px; dedo: sai depois de segurar 280ms parado */
function apertar(raiz, card, e){
  if (e.button !== 0 || KB.ar || KB.pego) return;
  const dedo = e.pointerType === "touch"; const x0 = e.clientX, y0 = e.clientY;
  let timer = null;
  const parar = () => { clearTimeout(timer); KB.segurando = false; removeEventListener("pointermove", mexeu); removeEventListener("pointerup", parar); removeEventListener("pointercancel", parar); };
  const mexeu = ev => {
    if (Math.hypot(ev.clientX - x0, ev.clientY - y0) < (dedo ? 8 : 5)) return;
    parar();
    if (!dedo) iniciar(raiz, card, ev, x0, y0);  /* no dedo, mexer antes do tempo é rolar a página */
  };
  if (dedo) { KB.segurando = true; timer = setTimeout(() => { parar(); iniciar(raiz, card, e, x0, y0); try { navigator.vibrate?.(12); } catch(_) {} }, 280); }
  addEventListener("pointermove", mexeu); addEventListener("pointerup", parar); addEventListener("pointercancel", parar);
}
function iniciar(raiz, card, e, x0, y0){
  const r = card.getBoundingClientRect();
  const ar = { raiz, card, de: lugarDe(card), dx: x0 - r.left, dy: y0 - r.top, px: e.clientX, py: e.clientY,
    wrap: raiz.querySelector(".kanban-wrap"), vaga: document.createElement("div"), voa: document.createElement("div"),
    fotos: new Map(), alvo: null, auto: 0, autoY: 0, raf: 0 };
  ar.voa.className = "k-voando"; ar.voa.style.width = r.width + "px";
  const copia = card.cloneNode(true); copia.removeAttribute("tabindex"); copia.removeAttribute("data-abrir"); copia.setAttribute("aria-hidden", "true");
  ar.voa.appendChild(copia); document.body.appendChild(ar.voa);
  ar.vaga.className = "k-vaga"; ar.vaga.style.height = r.height + "px";
  KB.ar = ar; document.body.classList.add("k-arrastando");
  /* foto sem o cartão e sem a vaga: o meio de cada cartão, contado do topo da coluna */
  card.classList.add("k-some");
  raiz.querySelectorAll(".col").forEach(col => {
    const top = col.getBoundingClientRect().top;
    ar.fotos.set(col, [...col.querySelectorAll(":scope > .card:not(.k-some)")].map(c => { const q = c.getBoundingClientRect(); return q.top - top + q.height / 2; }));
  });
  card.before(ar.vaga);  /* a vaga fica no lugar do cartão até o cursor mudar de lugar */
  const s0 = vagaEm(e.clientX, e.clientY); if (s0) porVaga(s0);
  posVoa(e.clientX, e.clientY);
  requestAnimationFrame(() => copia.classList.add("k-ergue"));
  ar.mover = ev => { ar.px = ev.clientX; ar.py = ev.clientY; posVoa(ev.clientX, ev.clientY); const s = vagaEm(ev.clientX, ev.clientY); if (s) porVaga(s); bordas(); };
  ar.soltar = () => soltar(false);
  ar.tecla = ev => { if (ev.key === "Escape") { ev.preventDefault(); ev.stopPropagation(); soltar(true); } };
  ar.engole = ev => { ev.stopPropagation(); ev.preventDefault(); };  /* o clique que vem depois de soltar não abre a ficha */
  addEventListener("pointermove", ar.mover); addEventListener("pointerup", ar.soltar); addEventListener("pointercancel", ar.soltar);
  addEventListener("keydown", ar.tecla, true); addEventListener("click", ar.engole, true);
  const passo = () => {
    if (KB.ar !== ar) return;
    if (ar.auto && ar.wrap) ar.wrap.scrollLeft += ar.auto;
    if (ar.autoY) scrollBy(0, ar.autoY);
    if (ar.auto || ar.autoY) { const s = vagaEm(ar.px, ar.py); if (s) porVaga(s); }
    ar.raf = requestAnimationFrame(passo);
  };
  ar.raf = requestAnimationFrame(passo);
}
const posVoa = (x, y) => { const ar = KB.ar; ar.voa.style.transform = `translate3d(${x - ar.dx}px,${y - ar.dy}px,0)`; };
/* perto da borda o quadro anda sozinho: para o lado no kanban, para cima e para baixo na página */
function bordas(){
  const ar = KB.ar; const x = ar.px, y = ar.py;
  if (ar.wrap) { const r = ar.wrap.getBoundingClientRect(); ar.auto = x < r.left + 72 ? -14 : x > r.right - 72 ? 14 : 0; }
  ar.autoY = y < 64 ? -12 : y > innerHeight - 64 ? 12 : 0;
}
function vagaEm(x, y){
  const ar = KB.ar; const cols = [...ar.raiz.querySelectorAll(".col")]; if (!cols.length) return null;
  let col = cols.find(c => { const r = c.getBoundingClientRect(); return x >= r.left && x <= r.right; });
  if (!col) col = cols.reduce((m, c) => { const r = c.getBoundingClientRect(); const d = Math.abs(x - (r.left + r.width / 2)); return d < m.d ? { c, d } : m; }, { c:null, d:Infinity }).c;
  const top = col.getBoundingClientRect().top; const mids = ar.fotos.get(col) || [];
  let i = mids.findIndex(m => y < top + m); if (i < 0) i = mids.length;
  return { col, i };
}
function porVaga(s){
  const ar = KB.ar;
  if (ar.alvo && ar.alvo.col === s.col && ar.alvo.i === s.i) return;
  ar.alvo = s;
  deslizar(ar.raiz, () => {
    const ref = [...s.col.querySelectorAll(":scope > .card:not(.k-some)")][s.i];
    if (ref) ref.before(ar.vaga); else s.col.appendChild(ar.vaga);
    ar.raiz.querySelectorAll(".col").forEach(c => c.classList.toggle("over", c === s.col && c !== ar.card.parentElement));
    contar(ar.raiz);
  });
}
function soltar(cancelar){
  const ar = KB.ar; if (!ar) return;
  cancelAnimationFrame(ar.raf);
  removeEventListener("pointermove", ar.mover); removeEventListener("pointerup", ar.soltar); removeEventListener("pointercancel", ar.soltar);
  removeEventListener("keydown", ar.tecla, true);
  setTimeout(() => removeEventListener("click", ar.engole, true), 0);
  ar.raiz.querySelectorAll(".col.over").forEach(c => c.classList.remove("over"));
  if (cancelar) deslizar(ar.raiz, () => { ar.card.before(ar.vaga); contar(ar.raiz); });
  const pousar = () => {
    ar.vaga.replaceWith(ar.card); ar.card.classList.remove("k-some"); ar.voa.remove();
    KB.ar = null; document.body.classList.remove("k-arrastando");
    contar(ar.raiz);
    const mudou = !cancelar && gravarLugar(ar.card, ar.de);
    if (mudou) { const p = posicao(ar.card); anunciar(`${porId(ar.card.dataset.id)?.titulo || "Tarefa"} foi para ${p.nome}, posição ${p.n}.`); }
    if (KB.depois) { KB.depois = false; render(); }
  };
  /* pouso: a cópia voa até a vaga e desfaz a inclinação */
  if (semMov()) return pousar();
  const d = ar.vaga.getBoundingClientRect();
  ar.voa.style.transition = "transform .2s cubic-bezier(.2,.8,.3,1)";
  ar.voa.style.transform = `translate3d(${d.left}px,${d.top}px,0)`;
  ar.voa.firstChild.classList.remove("k-ergue");
  setTimeout(pousar, 200);
}

/* teclado: espaço pega e solta, setas movem, Esc devolve */
function teclaCartao(raiz, card, e){
  const id = card.dataset.id; const pego = KB.pego && KB.pego.id === id;
  const titulo = porId(id)?.titulo || "Tarefa";
  if (e.key === " ") {
    e.preventDefault(); e.stopPropagation();
    if (pego) {
      card.classList.remove("k-pego"); const de = KB.pego.de; KB.pego = null;
      const p = posicao(card);
      if (gravarLugar(card, de)) KB.foco = id;
      anunciar(`${titulo} solto em ${p.nome}, posição ${p.n}.`);
    } else if (!KB.pego && !KB.ar) {
      KB.pego = { id, de: lugarDe(card) }; card.classList.add("k-pego");
      anunciar(`${titulo} pego. Use as setas para mover, espaço para soltar e Esc para cancelar.`);
    }
    return;
  }
  if (!pego) return;
  if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); KB.pego = null; KB.foco = id; render(); anunciar(`Cancelado. ${titulo} voltou para onde estava.`); return; }
  const col = card.parentElement; const cols = [...raiz.querySelectorAll(".col")]; const ci = cols.indexOf(col);
  const nCol = c => [...c.querySelectorAll(":scope > .card")].filter(x => x !== card);
  let mudar = null;
  if (e.key === "ArrowUp") { const a = card.previousElementSibling; if (a && a.matches(".card")) mudar = () => a.before(card); }
  if (e.key === "ArrowDown") { const p = card.nextElementSibling; if (p && p.matches(".card")) mudar = () => p.after(card); }
  if ((e.key === "ArrowLeft" && ci > 0) || (e.key === "ArrowRight" && ci < cols.length - 1)) {
    const alvo = cols[ci + (e.key === "ArrowLeft" ? -1 : 1)]; const i = nCol(col).length ? [...col.querySelectorAll(":scope > .card")].indexOf(card) : 0;
    const ref = nCol(alvo)[i];
    mudar = () => { if (ref) ref.before(card); else alvo.appendChild(card); };
  }
  if (!["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) return;
  e.preventDefault(); e.stopPropagation();
  if (!mudar) return;
  deslizar(raiz, () => { mudar(); contar(raiz); });
  card.focus({ preventScroll:true }); card.scrollIntoView({ block:"nearest", inline:"nearest" });
  const p = posicao(card); anunciar(`${titulo} em ${p.nome}, posição ${p.n}.`);
}

/* campoData monta o botão; o valor fica num input escondido com o id pedido ("2026-10-21", ou "de|até" no período).
   Ao escolher, o input dispara "change". Teclado: setas andam nos dias, PageUp/PageDown trocam o mês, Enter escolhe, Esc fecha */
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const I_SETA_E = `<path d="m15 18-6-6 6-6"/>`, I_SETA_D = `<path d="m9 18 6-6-6-6"/>`, I_DESCE = `<path d="m6 9 6 6 6-6"/>`;
const isoDe = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const deIso = iso => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
const somaDias = (iso, n) => { const d = deIso(iso); d.setDate(d.getDate() + n); return isoDe(d); };
const dataLonga = iso => { const d = deIso(iso); return `${d.getDate()} ${MESES[d.getMonth()].slice(0, 3)} ${d.getFullYear()}`; };
function textoData(v, periodo){
  if (!v) return "";
  if (!periodo) return dataLonga(v);
  const [a, b] = v.split("|");
  return b && b !== a ? `${dataCurta(a)} a ${dataCurta(b)}` : dataCurta(a);
}
const fimDp = (v, dis) => v && !dis ? `<span class="dp-x" role="button" aria-label="Limpar data" title="Limpar">×</span>` : IC(I_DESCE);
function campoData({ id, valor = "", vazio = "Escolher data", periodo = false, dis = "", rotulo = "" }){

      ${IC(I_CALENDARIO)}<span class="dp-v ${valor ? "" : "dp-nada"}">${valor ? textoData(valor, periodo) : esc(vazio)}</span>${fimDp(valor, dis)}
    </button></div>`;
}
let dpAberto = null;
function fecharCalendario(foco){
  if (!dpAberto) return; const { pop, dp, sair } = dpAberto; dpAberto = null;
  pop.remove(); sair(); const bt = dp.querySelector(".dp-bt"); bt.setAttribute("aria-expanded", "false"); if (foco && bt.isConnected) bt.focus();

function definirData(dp, v){
  const inp = dp.querySelector("input"); inp.value = v;
  const bt = dp.querySelector(".dp-bt"); const txt = bt.querySelector(".dp-v");
  txt.className = "dp-v " + (v ? "" : "dp-nada");

function abrirCalendario(dp){
  if (dpAberto && dpAberto.dp === dp) return fecharCalendario(true);
  fecharCalendario(false);
  const periodo = dp.hasAttribute("data-periodo"); const bt = dp.querySelector(".dp-bt");
  const val = dp.querySelector("input").value;
  let [ini, fim] = periodo ? (val ? val.split("|") : ["", ""]) : [val, ""];
  let escolhendoFim = false;  /* no período: o primeiro clique marca o começo, o segundo o fim */
  const h = hoje();
  let foco = ini || h; let mes = deIso(foco); mes.setDate(1);
  const pop = document.createElement("div"); pop.className = "dp-pop"; pop.setAttribute("role", "dialog"); pop.setAttribute("aria-label", periodo ? "Escolher período" : "Escolher data");
  (dp.closest("dialog") || document.body).appendChild(pop);
  let vista = "dias";  /* clicar no nome do mês abre a grade com os 12 meses (Luciano 21/10) */
  const desenharMeses = () => {
    const y = mes.getFullYear(), hj = deIso(h), sel = ini ? deIso(ini) : null;
    pop.innerHTML = `<div class="dp-cab"><button type="button" data-ano="-1" aria-label="Ano anterior">${IC(I_SETA_E)}</button><button type="button" class="dp-titulo" data-vista aria-label="Voltar aos dias">${y}</button><button type="button" data-ano="1" aria-label="Próximo ano">${IC(I_SETA_D)}</button></div>
      <div class="dp-meses">${MESES.map((n, i) => { const c = ["dp-m"];
        if (i === mes.getMonth()) c.push("atual");
        if (i === hj.getMonth() && y === hj.getFullYear()) c.push("hoje");
        if (sel && i === sel.getMonth() && y === sel.getFullYear()) c.push("sel");
        return `<button type="button" class="${c.join(" ")}" data-m="${i}" aria-label="${n} de ${y}">${n.slice(0, 3)}</button>`; }).join("")}</div>`;
    pop.querySelector(".dp-m.atual")?.focus();
  };
  const desenhar = focar => {
    if (vista === "meses") return desenharMeses();
    const y = mes.getFullYear(), m = mes.getMonth();
    const comeco = new Date(y, m, 1 - new Date(y, m, 1).getDay());
    const dias = []; for (let i = 0; i < 42; i++) { const d = new Date(comeco); d.setDate(comeco.getDate() + i); dias.push(d); }

  function emitir(){ for (const o of ouvintes) o(); }
  function consulta(col, ord, lim){
    const q = {
      orderBy: (f, d) => consulta(col, { f, d: d || "asc" }, lim),
      limit: n => consulta(col, ord, n),
      get: async () => snap(),
      onSnapshot(fn){ const o = () => fn(snap()); ouvintes.add(o); setTimeout(o, 0); return () => ouvintes.delete(o); },
    };

    }

  }

    return {
      id,
      async get(){ return snapDoc(id, (dados[col]||{})[id]); },

      async update(d){ const c = dados[col] || {}; if (!c[id]) throw { code:"invalid_argument", message:"não existe" }; Object.assign(c[id], JSON.parse(JSON.stringify(d))); gravar(); emitir(); },
      async delete(){ if (dados[col]) delete dados[col][id]; gravar(); emitir(); },
      onSnapshot(fn){ const o = () => fn(snapDoc(id, (dados[col]||{})[id])); ouvintes.add(o); setTimeout(o, 0); return () => ouvintes.delete(o); },
    };

    collection: col => Object.assign(consulta(col), { doc: id => docRef(col, id || novoId()), add: async d => { const id = novoId(); await docRef(col, id).set(d); return docRef(col, id); } }),
    doc: path => { const [col, id] = path.split("/"); return docRef(col, id); },
    exportar: () => JSON.parse(JSON.stringify(dados)),
    importar: novo => { dados = novo; gravar(); emitir(); },
  };
}
